{%extends 'base.html' %}

{% block content%}
<div class="m p list-border">
    <h1 class="text-center  p-10px font-monospace" style=" color:  red"><i class="bi bi-coin"></i> Expences    <i class="bi bi-coin"></i> </h1>
<table class="table " style="padding:10px; margin:10px">
    <tr>

        <th>Title</th>
        <th>amount</th>
        <th>category</th>
        <th>date</th>
        <th>Action</th>

    </tr>
    {% for i in expences %}
    <tr>

        <td>{{i.title}}</td>
        <td>{{i.amount}}</td>
        <td>{{i.category}}</td>
        <td>{{i.date}}</td>
        <td> <a href="{% url 'updateExpences' i.id %}" class="btn btn-outline-warning">  Update </a>
            <a href="{% url 'deleteExpences' i.id %}" class="btn btn-outline-danger"> <i class="bi bi-trash-fill"></i> Delete </a>
             </td>

    </tr>
    {%endfor%}
</table>
</div>

{%endblock content%}
